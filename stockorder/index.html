<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSVビューア (取引グループ対応)</title>
  <style>
    :root {
      --even-row: #f0f0f0;
      --odd-row: #ffffff;
      --border: #d0d0d0;
      --text: #222;
      --muted: #666;
      --bg: #fafafa;
      --panel: #ffffff;
      --accent: #2563eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Meiryo, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      align-items: center;
    }

    select,
    button,
    input[type="file"] {
      font: inherit;
    }

    select,
    button {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
    }

    button {
      cursor: pointer;
    }

    .status {
      margin-top: 12px;
      color: var(--muted);
      white-space: pre-wrap;
    }

    .summary {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .error {
      color: #b91c1c;
    }

    .table-wrap {
      overflow: auto;
      max-height: 72vh;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1150px;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f7f7f7;
      border-bottom: 1px solid var(--border);
      text-align: left;
      padding: 10px 12px;
      font-size: 14px;
      white-space: nowrap;
    }

    tbody td {
      padding: 10px 12px;
      border-bottom: 1px solid #ececec;
      font-size: 14px;
      vertical-align: top;
    }

    tbody tr.normal-even {
      background: var(--even-row);
    }

    tbody tr.normal-odd {
      background: var(--odd-row);
    }

    tbody tr.group-start td {
      border-top: 2px solid #bdbdbd;
    }

    .empty {
      padding: 24px;
      color: var(--muted);
    }

    .remark-cell {
      min-width: 340px;
      color: #333;
      vertical-align: top;
      white-space: normal;
      line-height: 1.5;
      background: #fff8dc;
      border-left: 3px solid #eab308;
    }

    .remark-textarea {
      width: 100%;
      min-height: 90px;
      resize: vertical;
      font: inherit;
      font-size: 13px;
      padding: 8px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      background: #fffdf5;
    }

    .auto-info {
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="panel">
      <div class="controls">
        <div>
          <select id="dateFilter" disabled>
            <option value="全ての日付">全ての日付</option>
          </select>
        </div>

        <div>
          <button id="exportNotesBtn">note CSVを保存</button>
        </div>
		
		<div id="status" class="status"></div>
        <div id="summary" class="summary"></div>
      </div>
	  
    </div>

    <div class="panel">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>注文日時</th>
              <th>売買</th>
              <th>約定数量[株/口]</th>
              <th>約定単価[円]</th>
              <th>備考</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="5" class="empty">まだデータはありません。</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const FILTER_COLUMN_VALUE = '約定代金[円]';
    const FILTER_VALUE_THRESHOLD = 1;
    const FILTER_COLUMN_DATE = '注文日時';

    const REPO_OWNER = "lethanhtung0208";
    const REPO_NAME = "books";
    const REPO_BRANCH = "main";
    const REPO_FOLDER = "stockorder";
    const NOTES_FILE_NAME = "stockorder_notes.csv";

    let fullData = [];
    let filteredData = [];
    let groupedDisplayData = [];
    let notesMap = {};

    const dateFilter = document.getElementById('dateFilter');
    const tableBody = document.getElementById('tableBody');
    const statusEl = document.getElementById('status');
    const summaryEl = document.getElementById('summary');
    const exportNotesBtn = document.getElementById('exportNotesBtn');

    dateFilter.addEventListener('change', applyDateFilter);
    exportNotesBtn.addEventListener('click', exportNotesCsv);

    function setStatus(message = '', isError = false) {
      if (!statusEl) return;
      statusEl.textContent = message;
      statusEl.className = isError ? 'status error' : 'status';
    }

    function extractYearFromFilename(filename) {
      const match = filename.match(/(\d{4})/);
      if (match) return match[1];
      return String(new Date().getFullYear());
    }

    function parseNumber(value) {
      if (value === null || value === undefined) return 0;
      const cleaned = String(value).replace(/,/g, '').trim();
      if (cleaned === '') return 0;
      const num = Number(cleaned);
      return Number.isFinite(num) ? num : 0;
    }

    function parseDateTimeWithYear(dateStr, year) {
      if (!dateStr || !year || typeof dateStr !== 'string') return null;

      const trimmed = dateStr.trim();

      let m = trimmed.match(/^(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2}):(\d{2})$/);
      if (m) {
        const [, mm, dd, hh, mi, ss] = m;
        return new Date(Number(year), Number(mm) - 1, Number(dd), Number(hh), Number(mi), Number(ss));
      }

      m = trimmed.match(/^(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})$/);
      if (m) {
        const [, mm, dd, hh, mi] = m;
        return new Date(Number(year), Number(mm) - 1, Number(dd), Number(hh), Number(mi), 0);
      }

      return null;
    }

    function formatDateTime(dt) {
      if (!(dt instanceof Date) || Number.isNaN(dt.getTime())) return '日付情報なし';
      const yyyy = dt.getFullYear();
      const mm = String(dt.getMonth() + 1).padStart(2, '0');
      const dd = String(dt.getDate()).padStart(2, '0');
      const hh = String(dt.getHours()).padStart(2, '0');
      const mi = String(dt.getMinutes()).padStart(2, '0');
      const ss = String(dt.getSeconds()).padStart(2, '0');
      return `${yyyy}/${mm}/${dd} ${hh}:${mi}:${ss}`;
    }

    function formatDateOnly(dt) {
      if (!(dt instanceof Date) || Number.isNaN(dt.getTime())) return '';
      const yyyy = dt.getFullYear();
      const mm = String(dt.getMonth() + 1).padStart(2, '0');
      const dd = String(dt.getDate()).padStart(2, '0');
      return `${yyyy}/${mm}/${dd}`;
    }

    function splitCsvLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        const next = line[i + 1];

        if (ch === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === ',' && !inQuotes) {
          result.push(current);
          current = '';
        } else {
          current += ch;
        }
      }

      result.push(current);
      return result;
    }

	function parseCsv(text) {
	  const normalized = text
		.replace(/^\uFEFF/, '')
		.replace(/\r\n/g, '\n')
		.replace(/\r/g, '\n');

	  const lines = normalized.split('\n').filter(line => line.trim() !== '');
	  if (lines.length === 0) return [];

	  const headers = splitCsvLine(lines[0]).map(h =>
		h.replace(/^\uFEFF/, '').trim()
	  );

	  const rows = [];

	  for (let i = 1; i < lines.length; i++) {
		const values = splitCsvLine(lines[i]);
		const row = {};
		headers.forEach((header, idx) => {
		  row[header] = (values[idx] ?? '').trim();
		});
		rows.push(row);
	  }

	  return rows;
	}

	async function readStockCsvText(response) {
	  const buffer = await response.arrayBuffer();
	  try {
		return new TextDecoder('shift_jis').decode(buffer);
	  } catch {
		return new TextDecoder('utf-8').decode(buffer);
	  }
	}

	async function readNotesCsvText(response) {
	  const buffer = await response.arrayBuffer();

	  // notes は UTF-8 BOM 前提で読む
	  try {
		return new TextDecoder('utf-8').decode(buffer);
	  } catch {
		return new TextDecoder('utf-8').decode(buffer);
	  }
	}

    function cleanAndProcessData(rows) {
      if (!rows || rows.length === 0) return [];

      const processed = rows.map(row => {
        const newRow = { ...row };

        if ('注文番号' in newRow) {
          newRow['注文番号'] = String(newRow['注文番号']);
        }

        newRow[FILTER_COLUMN_VALUE] = parseNumber(newRow[FILTER_COLUMN_VALUE]);

        if (FILTER_COLUMN_DATE in newRow && 'SourceYear' in newRow) {
          newRow.__parsedDate = parseDateTimeWithYear(newRow[FILTER_COLUMN_DATE], newRow['SourceYear']);
        } else {
          newRow.__parsedDate = null;
        }

        return newRow;
      });

      const seen = new Set();
      const deduped = [];
      for (const row of processed) {
        const key = JSON.stringify(row, (k, v) => v instanceof Date ? v.toISOString() : v);
        if (!seen.has(key)) {
          seen.add(key);
          deduped.push(row);
        }
      }

      const filtered = deduped.filter(
        row => Number(row[FILTER_COLUMN_VALUE]) > FILTER_VALUE_THRESHOLD
      );

      filtered.sort((a, b) => {
        const ad = a.__parsedDate instanceof Date ? a.__parsedDate.getTime() : -Infinity;
        const bd = b.__parsedDate instanceof Date ? b.__parsedDate.getTime() : -Infinity;
        if (ad !== bd) return ad - bd;

        const ao = String(a['注文番号'] ?? '');
        const bo = String(b['注文番号'] ?? '');
        return ao.localeCompare(bo, 'ja');
      });

      return filtered;
    }

    function updateDateOptions(data) {
      const uniqueDates = [...new Set(
        data
          .filter(row => row.__parsedDate instanceof Date && !Number.isNaN(row.__parsedDate.getTime()))
          .map(row => formatDateOnly(row.__parsedDate))
          .filter(Boolean)
      )].sort((a, b) => b.localeCompare(a, 'ja'));

      dateFilter.innerHTML = '<option value="全ての日付">全ての日付</option>';

      for (const d of uniqueDates) {
        const option = document.createElement('option');
        option.value = d;
        option.textContent = d;
        dateFilter.appendChild(option);
      }

      dateFilter.disabled = false;
      dateFilter.value = '全ての日付';
    }

    function isOpenSide(side) {
      return side === '買建' || side === '売建';
    }

    function sameDay(dateA, dateB) {
      return formatDateOnly(dateA) === formatDateOnly(dateB);
    }

    function makeTradeKey(row) {
      return `${formatDateTime(row.__parsedDate)}|${String(row['売買'] ?? '').trim()}`;
    }

    function buildTradeGroups(rows) {
      const displayRows = rows.map(row => ({
        row,
        groupId: null,
        remarkStart: false,
        remarkRowSpan: 1,
        tradeKey: ''
      }));

      let i = 0;
      let groupId = 1;

      while (i < rows.length) {
        const startRow = rows[i];
        const startSide = String(startRow['売買'] ?? '').trim();

        if (!isOpenSide(startSide)) {
          i++;
          continue;
        }

        const startDate = startRow.__parsedDate;
        if (!(startDate instanceof Date) || Number.isNaN(startDate.getTime())) {
          i++;
          continue;
        }

        const groupSide = startSide;
        const groupDay = formatDateOnly(startDate);

        let openQty = 0;
        let closeQty = 0;
        let openAmount = 0;
        let closeAmount = 0;

        const groupIndexes = [];
        let j = i;

        while (j < rows.length) {
          const r = rows[j];
          const side = String(r['売買'] ?? '').trim();
          const dt = r.__parsedDate;

          if (!(dt instanceof Date) || Number.isNaN(dt.getTime())) break;
          if (!sameDay(startDate, dt)) break;

          const qty = parseNumber(r['約定数量[株/口]']);
          const price = parseNumber(r['約定単価[円]']);

          if (groupSide === '買建') {
            if (side === '買建') {
              groupIndexes.push(j);
              openQty += qty;
              openAmount += qty * price;
            } else if (side === '売埋') {
              groupIndexes.push(j);
              closeQty += qty;
              closeAmount += qty * price;
              if (closeQty === openQty) break;
              if (closeQty > openQty) break;
            } else if (side === '売建') {
              break;
            }
          } else {
            if (side === '売建') {
              groupIndexes.push(j);
              openQty += qty;
              openAmount += qty * price;
            } else if (side === '買埋') {
              groupIndexes.push(j);
              closeQty += qty;
              closeAmount += qty * price;
              if (closeQty === openQty) break;
              if (closeQty > openQty) break;
            } else if (side === '買建') {
              break;
            }
          }

          j++;
        }

        if (groupIndexes.length >= 2 && openQty > 0 && closeQty === openQty) {
          const pnl = groupSide === '買建'
            ? (closeAmount - openAmount)
            : (openAmount - closeAmount);

          const tradeKey = makeTradeKey(rows[groupIndexes[0]]);
		  
          for (const idx of groupIndexes) {
            displayRows[idx].groupId = groupId;
            displayRows[idx].remarkStart = false;
            displayRows[idx].remarkRowSpan = 1;
            displayRows[idx].tradeKey = tradeKey;
          }

          displayRows[groupIndexes[0]].remarkStart = true;
          displayRows[groupIndexes[0]].remarkRowSpan = groupIndexes.length;

          groupId++;
          i = groupIndexes[groupIndexes.length - 1] + 1;
        } else {
          i++;
        }
      }

      return displayRows;
    }

    function renderTable(displayRows) {
      tableBody.innerHTML = '';

      if (!displayRows || displayRows.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="5" class="empty">--- 該当するレコードはありません ---</td>
          </tr>
        `;
        return;
      }

      let rowCounter = 0;

      for (const item of displayRows) {
        const tr = document.createElement('tr');
        tr.className = rowCounter % 2 === 0 ? 'normal-even' : 'normal-odd';
        rowCounter++;

        if (item.remarkStart) {
          tr.classList.add('group-start');
        }

        const row = item.row;
        const normalValues = [
          formatDateTime(row.__parsedDate),
          row['売買'] ?? '',
          row['約定数量[株/口]'] ?? '',
          row['約定単価[円]'] ?? ''
        ];

        normalValues.forEach(value => {
          const td = document.createElement('td');
          td.textContent = String(value);
          tr.appendChild(td);
        });

        if (item.remarkStart) {
          const td = document.createElement('td');
          td.className = 'remark-cell';
          td.rowSpan = item.remarkRowSpan;

          const autoInfo = document.createElement('div');
          autoInfo.className = 'auto-info';

          const textarea = document.createElement('textarea');
          textarea.className = 'remark-textarea';

          const key = item.tradeKey;
		  console.log('tradeKey used in UI:', key, 'note=', notesMap[key]);
          textarea.value = notesMap[key] || '';

          textarea.addEventListener('input', () => {
            notesMap[key] = textarea.value;
          });

          td.appendChild(autoInfo);
          td.appendChild(textarea);
          tr.appendChild(td);
        } else if (!item.groupId) {
          const td = document.createElement('td');
          td.textContent = '';
          td.className = 'remark-cell';
          tr.appendChild(td);
        }

        tableBody.appendChild(tr);
      }
    }

    function applyDateFilter() {
      const selected = dateFilter.value;

      if (selected === '全ての日付') {
        filteredData = [...fullData];
      } else {
        filteredData = fullData.filter(row => (
          row.__parsedDate instanceof Date &&
          !Number.isNaN(row.__parsedDate.getTime()) &&
          formatDateOnly(row.__parsedDate) === selected
        ));
      }

      groupedDisplayData = buildTradeGroups(filteredData);
      renderTable(groupedDisplayData);

      const tradeIds = new Set(groupedDisplayData.map(x => x.groupId).filter(Boolean));
      summaryEl.textContent =
        `表示行数: ${groupedDisplayData.length} 件 / 取引グループ数: ${tradeIds.size} 件 / 元データ件数: ${filteredData.length} 件`;
    }

    function csvEscape(value) {
      const s = String(value ?? '');
      if (s.includes('"') || s.includes(',') || s.includes('\n') || s.includes('\r')) {
        return '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    }

    function exportNotesCsv() {
      const entries = Object.entries(notesMap)
        .filter(([_, note]) => String(note).trim() !== '');

      const headers = ['tradeKey', 'note'];
      const lines = [headers.map(csvEscape).join(',')];

      for (const [tradeKey, note] of entries) {
        lines.push([tradeKey, note].map(csvEscape).join(','));
      }

      const csvText = '\uFEFF' + lines.join('\r\n');
      const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = NOTES_FILE_NAME;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      setStatus(`${NOTES_FILE_NAME} を保存しました。`, false);
    }

    async function listRepoFolderItems() {
      const apiUrl =
        `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${REPO_FOLDER}?ref=${REPO_BRANCH}`;

      const response = await fetch(apiUrl);
      if (!response.ok) {
        throw new Error(`CSV一覧取得失敗: ${response.status}`);
      }

      return await response.json();
    }

    async function listCsvFilesInRepoFolder() {
      const items = await listRepoFolderItems();

      return items
        .filter(item =>
          item.type === 'file' &&
          item.name.toLowerCase().endsWith('.csv') &&
          item.name !== NOTES_FILE_NAME
        )
        .sort((a, b) => a.name.localeCompare(b.name, 'ja'));
    }

    async function findNotesFileInRepoFolder() {
      const items = await listRepoFolderItems();

      return items.find(item =>
        item.type === 'file' &&
        item.name === NOTES_FILE_NAME
      ) || null;
    }

	async function loadNotesFromRepoFolder() {
	  try {
		const notesFile = await findNotesFileInRepoFolder();
		if (!notesFile) {
		  notesMap = {};
		  setStatus(`${NOTES_FILE_NAME} が見つかりません。notesなしで表示します。`, false);
		  return;
		}

		const response = await fetch(notesFile.download_url);
		if (!response.ok) {
		  throw new Error(`notes読込失敗: HTTP ${response.status}`);
		}

		const text = await readNotesCsvText(response);
		const rows = parseCsv(text);

		const nextMap = {};
		for (const row of rows) {
		  const tradeKey = String(row.tradeKey ?? '').trim();
		  const note = String(row.note ?? '');

		  if (tradeKey) {
			nextMap[tradeKey] = note;
		  }
		}

		notesMap = nextMap;
		console.log('notes loaded:', notesMap);
	  } catch (err) {
		console.error(err);
		notesMap = {};
	  }
	}

    async function loadAllCsvFromRepoFolder() {
      setStatus('CSV一覧を取得中...');

      const csvFiles = await listCsvFilesInRepoFolder();
      if (csvFiles.length === 0) {
        throw new Error('stockorder フォルダに stockorder CSV が見つかりません。');
      }

      const allRows = [];
      const errors = [];

      for (const file of csvFiles) {
        try {
          setStatus(`読込中: ${file.name}`);
          const response = await fetch(file.download_url);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const text = await readStockCsvText(response);
          const rows = parseCsv(text);
          const year = extractYearFromFilename(file.name);

          for (const row of rows) {
            row.SourceYear = year;
            allRows.push(row);
          }
        } catch (err) {
          errors.push(`${file.name}: ${err.message}`);
        }
      }

      fullData = cleanAndProcessData(allRows);

      await loadNotesFromRepoFolder();

      updateDateOptions(fullData);
      applyDateFilter();

      if (errors.length > 0) {
        setStatus(`読込完了（一部失敗あり）: ${errors.join(' | ')}`, false);
      } else {
        setStatus(`${csvFiles.length} 個のstockorder CSV と notes を読み込みました。`, false);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadAllCsvFromRepoFolder().catch(err => {
        setStatus(err.message || '読込に失敗しました。', true);
      });
    });
  </script>
</body>
</html>
