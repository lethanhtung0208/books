<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSVビューア (Google Drive連携版)</title>
  <style>
    :root {
      --even-row: #f0f0f0;
      --odd-row: #ffffff;
      --border: #d0d0d0;
      --text: #222;
      --muted: #666;
      --bg: #fafafa;
      --panel: #ffffff;
      --accent: #2563eb;
      --danger: #b91c1c;
      --success: #15803d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Meiryo, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      align-items: center;
    }

    select,
    button {
      font: inherit;
    }

    select,
    button {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
    }

    button {
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .status {
      margin-top: 12px;
      color: var(--muted);
      white-space: pre-wrap;
    }

    .status.error {
      color: var(--danger);
    }

    .status.success {
      color: var(--success);
    }

    .summary {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .table-wrap {
      overflow: auto;
      max-height: 72vh;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1150px;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f7f7f7;
      border-bottom: 1px solid var(--border);
      text-align: left;
      padding: 10px 12px;
      font-size: 14px;
      white-space: nowrap;
    }

    tbody td {
      padding: 10px 12px;
      border-bottom: 1px solid #ececec;
      font-size: 14px;
      vertical-align: top;
    }

    tbody tr.normal-even {
      background: var(--even-row);
    }

    tbody tr.normal-odd {
      background: var(--odd-row);
    }

    tbody tr.group-start td {
      border-top: 2px solid #bdbdbd;
    }

    .empty {
      padding: 24px;
      color: var(--muted);
    }

    .remark-cell {
      min-width: 340px;
      color: #333;
      vertical-align: top;
      white-space: normal;
      line-height: 1.5;
      background: #fff8dc;
      border-left: 3px solid #eab308;
    }

    .remark-textarea {
      width: 100%;
      min-height: 90px;
      resize: vertical;
      font: inherit;
      font-size: 13px;
      padding: 8px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      background: #fffdf5;
    }

    .auto-info {
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="panel">
      <div class="controls">
        <div>
          <select id="dateFilter" disabled>
            <option value="全ての日付">全ての日付</option>
          </select>
        </div>

        <div>
          <button id="reloadBtn">再読込</button>
        </div>

        <div>
          <button id="saveNotesBtn" class="primary">備考を保存</button>
        </div>
      </div>

      <div id="status" class="status"></div>
      <div id="summary" class="summary"></div>
      <div class="muted">
        GitHub Pages 上の画面から Apps Script 経由で Google Drive / Google Sheets を読み書きします。
      </div>
    </div>

    <div class="panel">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>注文日時</th>
              <th>売買</th>
              <th>約定数量[株/口]</th>
              <th>約定単価[円]</th>
              <th>備考</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="5" class="empty">まだデータはありません。</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const FILTER_COLUMN_VALUE = '約定代金[円]';
    const FILTER_VALUE_THRESHOLD = 1;
    const FILTER_COLUMN_DATE = '注文日時';

    // ここを書き換えてください
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxWavphXhz22D1b9Hma5i3ZXrjn0c9hSs9tnvx2C2hIiZT7RbSVSG71YZH7SAfMuQLRcw/exec';

    let fullData = [];
    let filteredData = [];
    let groupedDisplayData = [];
    let notesMap = {};

    let autoSaveTimer = null;
    let dirty = false;
    let saving = false;

    const dateFilter = document.getElementById('dateFilter');
    const tableBody = document.getElementById('tableBody');
    const statusEl = document.getElementById('status');
    const summaryEl = document.getElementById('summary');
    const reloadBtn = document.getElementById('reloadBtn');
    const saveNotesBtn = document.getElementById('saveNotesBtn');

    dateFilter.addEventListener('change', applyDateFilter);
    reloadBtn.addEventListener('click', () => {
      loadAllData().catch(err => {
        setStatus(err.message || '再読込に失敗しました。', 'error');
      });
    });
    saveNotesBtn.addEventListener('click', () => {
      saveNotesToServer(true).catch(err => {
        setStatus(err.message || '保存に失敗しました。', 'error');
      });
    });

    function setStatus(message = '', type = '') {
      statusEl.textContent = message;
      statusEl.className = 'status';
      if (type === 'error') statusEl.classList.add('error');
      if (type === 'success') statusEl.classList.add('success');
    }

    function parseNumber(value) {
      if (value === null || value === undefined) return 0;
      const cleaned = String(value).replace(/,/g, '').trim();
      if (cleaned === '') return 0;
      const num = Number(cleaned);
      return Number.isFinite(num) ? num : 0;
    }

    function parseDateTimeWithYear(dateStr, year) {
      if (!dateStr || !year || typeof dateStr !== 'string') return null;

      const trimmed = dateStr.trim();

      let m = trimmed.match(/^(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2}):(\d{2})$/);
      if (m) {
        const [, mm, dd, hh, mi, ss] = m;
        return new Date(Number(year), Number(mm) - 1, Number(dd), Number(hh), Number(mi), Number(ss));
      }

      m = trimmed.match(/^(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})$/);
      if (m) {
        const [, mm, dd, hh, mi] = m;
        return new Date(Number(year), Number(mm) - 1, Number(dd), Number(hh), Number(mi), 0);
      }

      return null;
    }

    function formatDateTime(dt) {
      if (!(dt instanceof Date) || Number.isNaN(dt.getTime())) return '日付情報なし';
      const yyyy = dt.getFullYear();
      const mm = String(dt.getMonth() + 1).padStart(2, '0');
      const dd = String(dt.getDate()).padStart(2, '0');
      const hh = String(dt.getHours()).padStart(2, '0');
      const mi = String(dt.getMinutes()).padStart(2, '0');
      const ss = String(dt.getSeconds()).padStart(2, '0');
      return `${yyyy}/${mm}/${dd} ${hh}:${mi}:${ss}`;
    }

    function formatDateOnly(dt) {
      if (!(dt instanceof Date) || Number.isNaN(dt.getTime())) return '';
      const yyyy = dt.getFullYear();
      const mm = String(dt.getMonth() + 1).padStart(2, '0');
      const dd = String(dt.getDate()).padStart(2, '0');
      return `${yyyy}/${mm}/${dd}`;
    }

    function cleanAndProcessData(rows) {
      if (!rows || rows.length === 0) return [];

      const processed = rows.map(row => {
        const newRow = { ...row };

        if ('注文番号' in newRow) {
          newRow['注文番号'] = String(newRow['注文番号']);
        }

        newRow[FILTER_COLUMN_VALUE] = parseNumber(newRow[FILTER_COLUMN_VALUE]);

        if (FILTER_COLUMN_DATE in newRow && 'SourceYear' in newRow) {
          newRow.__parsedDate = parseDateTimeWithYear(newRow[FILTER_COLUMN_DATE], newRow['SourceYear']);
        } else {
          newRow.__parsedDate = null;
        }

        return newRow;
      });

      const seen = new Set();
      const deduped = [];
      for (const row of processed) {
        const key = JSON.stringify(row, (k, v) => v instanceof Date ? v.toISOString() : v);
        if (!seen.has(key)) {
          seen.add(key);
          deduped.push(row);
        }
      }

      const filtered = deduped.filter(
        row => Number(row[FILTER_COLUMN_VALUE]) > FILTER_VALUE_THRESHOLD
      );

      filtered.sort((a, b) => {
        const ad = a.__parsedDate instanceof Date ? a.__parsedDate.getTime() : -Infinity;
        const bd = b.__parsedDate instanceof Date ? b.__parsedDate.getTime() : -Infinity;
        if (ad !== bd) return ad - bd;

        const ao = String(a['注文番号'] ?? '');
        const bo = String(b['注文番号'] ?? '');
        return ao.localeCompare(bo, 'ja');
      });

      return filtered;
    }

    function updateDateOptions(data) {
      const uniqueDates = [...new Set(
        data
          .filter(row => row.__parsedDate instanceof Date && !Number.isNaN(row.__parsedDate.getTime()))
          .map(row => formatDateOnly(row.__parsedDate))
          .filter(Boolean)
      )].sort((a, b) => b.localeCompare(a, 'ja'));

      dateFilter.innerHTML = '<option value="全ての日付">全ての日付</option>';

      for (const d of uniqueDates) {
        const option = document.createElement('option');
        option.value = d;
        option.textContent = d;
        dateFilter.appendChild(option);
      }

      dateFilter.disabled = false;
      dateFilter.value = '全ての日付';
    }

    function isOpenSide(side) {
      return side === '買建' || side === '売建';
    }

    function sameDay(dateA, dateB) {
      return formatDateOnly(dateA) === formatDateOnly(dateB);
    }

    function makeTradeKey(row) {
      return `${formatDateTime(row.__parsedDate)}|${String(row['売買'] ?? '').trim()}`;
    }

    function buildTradeGroups(rows) {
      const displayRows = rows.map(row => ({
        row,
        groupId: null,
        remarkStart: false,
        remarkRowSpan: 1,
        tradeKey: ''
      }));

      let i = 0;
      let groupId = 1;

      while (i < rows.length) {
        const startRow = rows[i];
        const startSide = String(startRow['売買'] ?? '').trim();

        if (!isOpenSide(startSide)) {
          i++;
          continue;
        }

        const startDate = startRow.__parsedDate;
        if (!(startDate instanceof Date) || Number.isNaN(startDate.getTime())) {
          i++;
          continue;
        }

        const groupSide = startSide;

        let openQty = 0;
        let closeQty = 0;
        let openAmount = 0;
        let closeAmount = 0;

        const groupIndexes = [];
        let j = i;

        while (j < rows.length) {
          const r = rows[j];
          const side = String(r['売買'] ?? '').trim();
          const dt = r.__parsedDate;

          if (!(dt instanceof Date) || Number.isNaN(dt.getTime())) break;
          if (!sameDay(startDate, dt)) break;

          const qty = parseNumber(r['約定数量[株/口]']);
          const price = parseNumber(r['約定単価[円]']);

          if (groupSide === '買建') {
            if (side === '買建') {
              groupIndexes.push(j);
              openQty += qty;
              openAmount += qty * price;
            } else if (side === '売埋') {
              groupIndexes.push(j);
              closeQty += qty;
              closeAmount += qty * price;
              if (closeQty === openQty) break;
              if (closeQty > openQty) break;
            } else if (side === '売建') {
              break;
            }
          } else {
            if (side === '売建') {
              groupIndexes.push(j);
              openQty += qty;
              openAmount += qty * price;
            } else if (side === '買埋') {
              groupIndexes.push(j);
              closeQty += qty;
              closeAmount += qty * price;
              if (closeQty === openQty) break;
              if (closeQty > openQty) break;
            } else if (side === '買建') {
              break;
            }
          }

          j++;
        }

        if (groupIndexes.length >= 2 && openQty > 0 && closeQty === openQty) {
          const tradeKey = makeTradeKey(rows[groupIndexes[0]]);

          for (const idx of groupIndexes) {
            displayRows[idx].groupId = groupId;
            displayRows[idx].remarkStart = false;
            displayRows[idx].remarkRowSpan = 1;
            displayRows[idx].tradeKey = tradeKey;
          }

          displayRows[groupIndexes[0]].remarkStart = true;
          displayRows[groupIndexes[0]].remarkRowSpan = groupIndexes.length;

          groupId++;
          i = groupIndexes[groupIndexes.length - 1] + 1;
        } else {
          i++;
        }
      }

      return displayRows;
    }

    function renderTable(displayRows) {
      tableBody.innerHTML = '';

      if (!displayRows || displayRows.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="5" class="empty">--- 該当するレコードはありません ---</td>
          </tr>
        `;
        return;
      }

      let rowCounter = 0;

      for (const item of displayRows) {
        const tr = document.createElement('tr');
        tr.className = rowCounter % 2 === 0 ? 'normal-even' : 'normal-odd';
        rowCounter++;

        if (item.remarkStart) {
          tr.classList.add('group-start');
        }

        const row = item.row;
        const normalValues = [
          formatDateTime(row.__parsedDate),
          row['売買'] ?? '',
          row['約定数量[株/口]'] ?? '',
          row['約定単価[円]'] ?? ''
        ];

        normalValues.forEach(value => {
          const td = document.createElement('td');
          td.textContent = String(value);
          tr.appendChild(td);
        });

        if (item.remarkStart) {
          const td = document.createElement('td');
          td.className = 'remark-cell';
          td.rowSpan = item.remarkRowSpan;

          const autoInfo = document.createElement('div');
          autoInfo.className = 'auto-info';
          autoInfo.textContent = '入力後、自動保存されます。';

          const textarea = document.createElement('textarea');
          textarea.className = 'remark-textarea';

          const key = item.tradeKey;
          textarea.value = notesMap[key] || '';

          textarea.addEventListener('input', () => {
            notesMap[key] = textarea.value;
            dirty = true;
            queueAutoSave();
          });

          td.appendChild(autoInfo);
          td.appendChild(textarea);
          tr.appendChild(td);
        } else if (!item.groupId) {
          const td = document.createElement('td');
          td.textContent = '';
          td.className = 'remark-cell';
          tr.appendChild(td);
        }

        tableBody.appendChild(tr);
      }
    }

    function applyDateFilter() {
      const selected = dateFilter.value;

      if (selected === '全ての日付') {
        filteredData = [...fullData];
      } else {
        filteredData = fullData.filter(row => (
          row.__parsedDate instanceof Date &&
          !Number.isNaN(row.__parsedDate.getTime()) &&
          formatDateOnly(row.__parsedDate) === selected
        ));
      }

      groupedDisplayData = buildTradeGroups(filteredData);
      renderTable(groupedDisplayData);

      const tradeIds = new Set(groupedDisplayData.map(x => x.groupId).filter(Boolean));
      summaryEl.textContent =
        `表示行数: ${groupedDisplayData.length} 件 / 取引グループ数: ${tradeIds.size} 件 / 元データ件数: ${filteredData.length} 件`;
    }

    function queueAutoSave() {
      if (autoSaveTimer) {
        clearTimeout(autoSaveTimer);
      }

      setStatus('備考を自動保存待ち...', '');
      autoSaveTimer = setTimeout(() => {
        saveNotesToServer(false).catch(err => {
          setStatus(err.message || '自動保存に失敗しました。', 'error');
        });
      }, 800);
    }

    async function apiGet(action) {
      const url = `${APPS_SCRIPT_URL}?action=${encodeURIComponent(action)}`;
      const response = await fetch(url, { method: 'GET' });

      if (!response.ok) {
        throw new Error(`通信失敗: HTTP ${response.status}`);
      }

      const data = await response.json();
      if (!data || data.ok !== true) {
        throw new Error(data && data.error ? data.error : 'サーバー処理に失敗しました。');
      }

      return data;
    }

    async function apiPost(payload) {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error(`通信失敗: HTTP ${response.status}`);
      }

      const data = await response.json();
      if (!data || data.ok !== true) {
        throw new Error(data && data.error ? data.error : 'サーバー処理に失敗しました。');
      }

      return data;
    }

    async function loadAllData() {
      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_WEB_APP_URL') {
        throw new Error('APPS_SCRIPT_URL を設定してください。');
      }

      setStatus('Google Drive からデータを読み込み中...', '');

      const result = await apiGet('load');

      const stockRows = Array.isArray(result.stockRows) ? result.stockRows : [];
      const serverNotesMap = result.notesMap && typeof result.notesMap === 'object'
        ? result.notesMap
        : {};

      fullData = cleanAndProcessData(stockRows);
      notesMap = serverNotesMap;
      dirty = false;

      updateDateOptions(fullData);
      applyDateFilter();

      setStatus(
        `${result.csvFileCount ?? 0} 個の stock CSV と備考を読み込みました。`,
        'success'
      );
    }

    async function saveNotesToServer(manual = false) {
      if (saving) return;
      if (!dirty && !manual) return;

      saving = true;
      setStatus(manual ? '備考を保存中...' : '備考を自動保存中...', '');

      const cleanedNotes = {};
      for (const [key, value] of Object.entries(notesMap)) {
        const trimmed = String(value ?? '');
        if (trimmed !== '') {
          cleanedNotes[key] = trimmed;
        }
      }

      try {
        await apiPost({
          action: 'saveNotes',
          notesMap: cleanedNotes
        });

        dirty = false;
        setStatus('備考を保存しました。', 'success');
      } finally {
        saving = false;
      }
    }

    window.addEventListener('beforeunload', (e) => {
      if (dirty) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      loadAllData().catch(err => {
        setStatus(err.message || '読込に失敗しました。', 'error');
      });
    });
  </script>
</body>
</html>
